name: Ansible CI

on:
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint and syntax-check the playbooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: python -m pip install ansible-core ansible-lint

      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint (production profile, from .ansible-lint)
        run: ansible-lint

      - name: Syntax-check every playbook
        run: |
          set -e
          for playbook in site.yml verify.yml teardown.yml; do
            echo "::group::${playbook}"
            ansible-playbook "${playbook}" --syntax-check
            echo "::endgroup::"
          done
