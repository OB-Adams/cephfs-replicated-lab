---
- name: Read the msgr2 modes
  ansible.builtin.command: ceph config get mon {{ item }}
  loop: "{{ ceph_security_msgr_settings }}"
  register: ceph_security_now
  changed_when: false
  check_mode: false

- name: Set the modes that differ
  ansible.builtin.command: ceph config set global {{ item.item }} {{ ceph_security_msgr_mode }}
  loop: "{{ ceph_security_now.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim != ceph_security_msgr_mode
  changed_when: true
