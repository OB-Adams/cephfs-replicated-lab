[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = root
interpreter_python = auto_silent
forks = 10
retry_files_enabled = False
callback_result_format = yaml
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
